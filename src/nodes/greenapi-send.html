<script type="text/javascript">
    (function () {
        var VALUE_TYPES = ["msg", "flow", "global", "str", "num", "json", "env"];
        var FIELDS = {
            chatId: {types: VALUE_TYPES, sendTypes: ["text", "fileUrl", "fileUpload", "location", "contact", "poll"]},
            message: {types: VALUE_TYPES, sendTypes: ["text", "poll"]},
            urlFile: {types: VALUE_TYPES, sendTypes: ["fileUrl"]},
            file: {types: ["msg", "flow", "global", "bin", "str"], sendTypes: ["fileUpload", "uploadFile"]},
            fileName: {types: VALUE_TYPES, sendTypes: ["fileUrl", "fileUpload", "uploadFile"]},
            caption: {types: VALUE_TYPES, sendTypes: ["fileUrl", "fileUpload"]},
            latitude: {types: VALUE_TYPES, sendTypes: ["location"]},
            longitude: {types: VALUE_TYPES, sendTypes: ["location"]},
            nameLocation: {types: VALUE_TYPES, sendTypes: ["location"]},
            address: {types: VALUE_TYPES, sendTypes: ["location"]},
            phoneContact: {types: VALUE_TYPES, sendTypes: ["contact"]},
            contactChatId: {types: VALUE_TYPES, sendTypes: ["contact"]},
            firstName: {types: VALUE_TYPES, sendTypes: ["contact"]},
            lastName: {types: VALUE_TYPES, sendTypes: ["contact"]},
            company: {types: VALUE_TYPES, sendTypes: ["contact"]},
            options: {types: ["json", "msg", "flow", "global", "str"], sendTypes: ["poll"]},
            quotedMessageId: {types: VALUE_TYPES, sendTypes: ["text", "fileUrl", "fileUpload", "location", "contact", "poll"]}
        };

        RED.nodes.registerType("greenapi-send", {
            category: "GREEN API",
            color: "#87D3A3",
            defaults: {
                name: {value: ""},
                instance: {value: "", type: "greenapi-instance", required: true},
                sendType: {value: "text"},
                chatId: {value: "chatId"}, chatIdType: {value: "msg"},
                message: {value: "payload"}, messageType: {value: "msg"},
                urlFile: {value: ""}, urlFileType: {value: "str"},
                file: {value: "payload"}, fileType: {value: "msg"},
                fileName: {value: "filename"}, fileNameType: {value: "msg"},
                caption: {value: ""}, captionType: {value: "str"},
                latitude: {value: ""}, latitudeType: {value: "num"},
                longitude: {value: ""}, longitudeType: {value: "num"},
                nameLocation: {value: ""}, nameLocationType: {value: "str"},
                address: {value: ""}, addressType: {value: "str"},
                phoneContact: {value: ""}, phoneContactType: {value: "str"},
                contactChatId: {value: ""}, contactChatIdType: {value: "str"},
                firstName: {value: ""}, firstNameType: {value: "str"},
                lastName: {value: ""}, lastNameType: {value: "str"},
                company: {value: ""}, companyType: {value: "str"},
                options: {value: "[\"Yes\",\"No\"]"}, optionsType: {value: "json"},
                multipleAnswers: {value: false},
                quotedMessageId: {value: ""}, quotedMessageIdType: {value: "str"}
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-paper-plane",
            align: "right",
            label: function () {
                return this.name || (this.sendType === "uploadFile" ? "upload file" : "send " + this.sendType);
            },
            paletteLabel: "send",
            oneditprepare: function () {
                Object.keys(FIELDS).forEach(function (field) {
                    $("#node-input-" + field).typedInput({
                        default: "str",
                        typeField: "#node-input-" + field + "Type",
                        types: FIELDS[field].types
                    });
                });
                var toggle = function () {
                    var sendType = $("#node-input-sendType").val();
                    Object.keys(FIELDS).forEach(function (field) {
                        $("#greenapi-send-row-" + field).toggle(FIELDS[field].sendTypes.indexOf(sendType) !== -1);
                    });
                    $("#greenapi-send-row-multipleAnswers").toggle(sendType === "poll");
                };
                $("#node-input-sendType").on("change", toggle);
                toggle();
            }
        });
    })();
</script>

<script type="text/html" data-help-name="greenapi-send">
    <p>Sends a message through a GREEN-API instance (WhatsApp, Telegram or MAX).</p>
    <p>Every field can be a fixed value or read from <code>msg</code>, flow or global context.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>chatId <span class="property-type">string | number</span></dt>
        <dd>Chat ID (<code>79001234567@c.us</code>, <code>...@g.us</code>, <code>...@lid</code>, a Telegram or MAX chat ID) or a phone number. Anything with <code>@</code> is sent as is. A phone number is turned into <code>&lt;digits&gt;@c.us</code>. For Telegram and MAX a plain number is treated as a chat ID. Default <code>msg.chatId</code>.</dd>
        <dt>message <span class="property-type">string</span></dt>
        <dd>Text for <b>Text</b>, question for <b>Poll</b>. Default <code>msg.payload</code>.</dd>
        <dt>file <span class="property-type">Buffer</span></dt>
        <dd><b>File upload</b>, <b>Upload only</b>: file content. Default <code>msg.payload</code>, as set by the <i>read file</i> node.</dd>
        <dt>fileName <span class="property-type">string</span></dt>
        <dd>File name with extension. A path is reduced to its base name. Default <code>msg.filename</code>.</dd>
        <dt>contactChatId <span class="property-type">string</span></dt>
        <dd><b>Contact</b> on MAX: chat ID of the contact to send. It must be in the instance contacts. WhatsApp and Telegram use Phone and the names instead.</dd>
        <dt>options <span class="property-type">array | string</span></dt>
        <dd><b>Poll</b>: array of strings, or one option per line.</dd>
        <dt>quotedMessageId <span class="property-type">string</span></dt>
        <dd>Optional. ID of the message to reply to.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>GREEN-API response, e.g. <code>{"idMessage": "..."}</code>. For <b>Upload only</b>: <code>{"urlFile": "..."}</code>.</dd>
    </dl>
    <h3>Details</h3>
    <p><b>Upload only</b> uploads the file to GREEN-API storage without sending it and outputs a temporary link. Send that link to any number of chats with <b>File by URL</b> instead of uploading the same file again for each chat.</p>
    <p>Errors are reported to the <i>catch</i> node. Messenger limits apply, e.g. Telegram polls work only in groups.</p>
</script>
